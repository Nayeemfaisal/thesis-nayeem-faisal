name: Verify thesis website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test production build
        run: npm test
      - name: Lint source
        run: npm run lint

  tha-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile THA LaTeX workspace preview
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: academic-source/tha-template
          root_file: Nayeem-Faisal-THA-Workspace.tex
          texlive_version: 2026
      - name: Upload preview PDF
        uses: actions/upload-artifact@v4
        with:
          name: tha-template-preview
          path: academic-source/tha-template/Nayeem-Faisal-THA-Workspace.pdf
